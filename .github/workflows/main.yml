name: Build ArtCraft-X (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # إعداد Node.js 20+ كما هو مطلوب في المشروع
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # إعداد لغة Rust للويندوز
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      # 1. الدخول لمجلد الواجهة الأمامية وتثبيت حزم NPM
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # 2. فحص كود Rust من المجلد الرئيسي مباشرة (حيث يوجد Cargo.toml)
      - name: Check Rust Code Formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Lint Rust Code
        run: cargo clippy -- -D warnings
        continue-on-error: true

      # 3. تثبيت أداة Tauri 2 وبناء التطبيق
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Tauri App
        run: cargo tauri build

      # 4. استخراج ملف التثبيت النهائي (EXE أو MSI) لتتمكن من تحميله
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ArtCraft-X-Installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: warn
