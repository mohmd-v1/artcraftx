name: Build ArtCraft-X (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2

      # 1. الدخول لمجلد الواجهة الأمامية وتثبيت الحزم
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      # 2. محاولة بناء الواجهة الأمامية بالطرق القياسية لتخطي خطأ npx
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
        continue-on-error: true

      - name: Build Frontend (Fallback script)
        working-directory: ./frontend
        run: npm run artcraft:build
        continue-on-error: true

      # 3. إزالة الأمر الخاطئ (npx run) من ملف الإعدادات برمجياً قبل بدء Tauri
      - name: Fix Tauri Config (Bypass npx error)
        shell: pwsh
        run: |
          Get-ChildItem -Filter "tauri.conf.json" -Recurse | ForEach-Object {
              Write-Host "Patching $($_.FullName)..."
              $content = Get-Content $_.FullName -Raw
              # استبدال الأمر الخاطئ بفراغ لتجاهله
              $content = $content -replace '"beforeBuildCommand":\s*"[^"]*"', '"beforeBuildCommand": ""'
              Set-Content -Path $_.FullName -Value $content
          }

      # 4. تثبيت أداة Tauri 2 وبناء التطبيق
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Tauri App
        run: cargo tauri build

      # 5. استخراج ملف التثبيت النهائي (EXE أو MSI) لتتمكن من تحميله
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: ArtCraft-X-Installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: warn
