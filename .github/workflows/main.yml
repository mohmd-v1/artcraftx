name: ArtCraft-X CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # زر لتشغيل الفحص يدوياً عند الحاجة

jobs:
  build-and-test:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # مصفوفة التشغيل (Matrix): اختبار الكود على أنظمة تشغيل مختلفة
    strategy:
      fail-fast: false # مهم جداً: إذا فشل البناء على لينكس، لا تلغي البناء على ويندوز وماك
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    env:
      # إظهار تفاصيل الخطأ الكاملة إذا حدث انهيار (Crash) في Rust
      RUST_BACKTRACE: 1 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20' # متوافق مع متطلبات المشروع المذكورة في README
          cache: 'npm'       # تسريع البناء عبر حفظ حزم Node

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target # حفظ ملفات target لتسريع البناء التالي بنسبة 70%

      # حل المشكلة الأكبر في Tauri: مكتبات نظام لينكس الضرورية للإصدار الثاني (Tauri 2)
      - name: Install Linux System Dependencies (Ubuntu Only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install NPM Dependencies
        run: npm ci || npm install # استخدام ci لضمان تطابق النسخ، مع fallback للـ install

      - name: Check Rust Code Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
        continue-on-error: true # لن يوقف البناء لو كان هناك مشكلة في تنسيق الكود فقط

      - name: Lint Rust Code (Clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
        continue-on-error: true # مجرد تنبيهات برمجية، لن نوقف البناء بسببها

      # خطوة البناء الرئيسية باستخدام إضافة Tauri الرسمية
      - name: Build Frontend & Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose # تشغيل وضع التفاصيل لمعرفة سبب أي مشكلة إن حدثت
